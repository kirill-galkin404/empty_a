<!DOCTYPE html>
<html ng-app="todoApp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-controller="MainCtrl">

  <nav class="navbar navbar-inverse navbar-static-top">
    <div class="container">
      <div class="navbar-header">
        <a class="navbar-brand" href="#/">Todo</a>
      </div>
      <ul class="nav navbar-nav" ng-show="currentUser">
        <li ng-class="{active: isActive('/todos')}"><a href="#/todos">Todos</a></li>
        <li ng-class="{active: isActive('/stats')}"><a href="#/stats">Stats</a></li>
        <li ng-class="{active: isActive('/settings')}"><a href="#/settings">Settings</a></li>
      </ul>
      <ul class="nav navbar-nav navbar-right" ng-show="currentUser">
        <li><p class="navbar-text">Hi, {{currentUser.username}}</p></li>
        <li><a href="" ng-click="logout()">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="alert alert-danger" ng-show="globalError">
      <button type="button" class="close" ng-click="globalError = null">&times;</button>
      {{globalError}}
    </div>
    <div ng-view></div>
  </div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-route.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/services.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/controllers.js"></script>
</body>
</html>
