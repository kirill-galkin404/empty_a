<div class="row" ng-show="todo">
  <div class="col-md-6 col-md-offset-3">
    <h3>Edit todo</h3>
    <div class="alert alert-danger" ng-show="error">{{error}}</div>
    <form ng-submit="save()">
      <div class="form-group">
        <label>Title</label>
        <input type="text" class="form-control" ng-model="todo.title" required>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea class="form-control" rows="4" ng-model="todo.notes"></textarea>
      </div>
      <div class="row">
        <div class="col-sm-4 form-group">
          <label>List</label>
          <select class="form-control" ng-model="todo.list_id" ng-options="l.id as l.name for l in lists"></select>
        </div>
        <div class="col-sm-4 form-group">
          <label>Priority</label>
          <select class="form-control" ng-model="todo.priority" ng-options="p as (p | priorityLabel) for p in [1,2,3]"></select>
        </div>
        <div class="col-sm-4 form-group">
          <label>Due date</label>
          <input type="date" class="form-control" ng-model="todo.due_date">
        </div>
      </div>
      <div class="form-group">
        <label>Tags (comma separated)</label>
        <input type="text" class="form-control" ng-model="todo.tagsText">
      </div>
      <div class="checkbox">
        <label><input type="checkbox" ng-model="todo.done"> Completed</label>
      </div>
      <p class="text-muted small">Created {{todo.created_at | fromNow}}, updated {{todo.updated_at | fromNow}}</p>
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-default" ng-click="cancel()">Cancel</button>
    </form>
  </div>
</div>
