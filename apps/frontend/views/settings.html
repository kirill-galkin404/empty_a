<div class="row">
  <div class="col-md-5">
    <h3>Settings</h3>
    <p class="text-muted">Signed in as <b>{{me.username}}</b> since {{me.created_at | prettyDate}}</p>
    <div class="alert alert-{{message.type}}" ng-show="message">{{message.text}}</div>
    <form ng-submit="save()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" ng-model="form.email">
      </div>
      <div class="form-group">
        <label>New password</label>
        <input type="password" class="form-control" ng-model="form.password" placeholder="leave empty to keep">
      </div>
      <div class="form-group">
        <label>Repeat new password</label>
        <input type="password" class="form-control" ng-model="form.password2">
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </div>
</div>
