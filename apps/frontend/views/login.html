<div class="row">
  <div class="col-md-4 col-md-offset-4">
    <div class="panel panel-default auth-panel">
      <div class="panel-heading"><h3 class="panel-title">Sign in</h3></div>
      <div class="panel-body">
        <div class="alert alert-danger" ng-show="error">{{error}}</div>
        <form ng-submit="login()">
          <div class="form-group">
            <label>Username</label>
            <input type="text" class="form-control" ng-model="form.username" required autofocus>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" ng-model="form.password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" ng-disabled="loading">
            <span ng-show="loading">Signing in...</span><span ng-hide="loading">Sign in</span>
          </button>
        </form>
        <hr>
        <p class="text-center">No account? <a href="#/register">Register</a></p>
      </div>
    </div>
  </div>
</div>
