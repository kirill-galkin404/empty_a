<div class="row">
  <div class="col-md-4 col-md-offset-4">
    <div class="panel panel-default auth-panel">
      <div class="panel-heading"><h3 class="panel-title">Create account</h3></div>
      <div class="panel-body">
        <div class="alert alert-danger" ng-show="error">{{error}}</div>
        <form ng-submit="register()">
          <div class="form-group">
            <label>Username</label>
            <input type="text" class="form-control" ng-model="form.username" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" ng-model="form.email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" ng-model="form.password" required>
          </div>
          <div class="form-group">
            <label>Repeat password</label>
            <input type="password" class="form-control" ng-model="form.password2" required>
          </div>
          <button type="submit" class="btn btn-success btn-block">Register</button>
        </form>
        <hr>
        <p class="text-center"><a href="#/login">Back to sign in</a></p>
      </div>
    </div>
  </div>
</div>
